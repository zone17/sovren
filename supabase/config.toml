# Supabase Edge Functions Configuration
# US-210: Supabase Edge Functions Implementation

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[graphql]
enabled = true
port = 54322

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[realtime]
enabled = true
ip_version = "ipv4"

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

# Edge Functions Configuration
[functions]
verify_jwt = false

[functions.auth]
verify_jwt = true

[functions.content]
verify_jwt = true

[functions.notifications]
verify_jwt = false

# Project details
project_id = "sovren-edge-functions"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
jwt_secret = "super-secret-jwt-token-with-at-least-32-characters-long"
enable_signup = true
email_double_confirm_url = "http://localhost:3000/auth/v1/verify"
email_confirm_url = "http://localhost:3000/auth/v1/verify"
email_change_confirm_url = "http://localhost:3000/auth/v1/verify"
email_reset_confirm_url = "http://localhost:3000/auth/v1/verify"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Development settings
[db]
port = 54322
shadow_port = 54320
major_version = 15

[edge_runtime]
enabled = true
port = 54325
inspector_port = 54326

[analytics]
enabled = false
