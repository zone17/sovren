# Fluentd Production Configuration
# Collects structured logs from Docker containers and forwards them.

# ──────────────────────────────────────────────────────────────
# Input: tail Docker container log files
# ──────────────────────────────────────────────────────────────
<source>
  @type tail
  path /var/lib/docker/containers/**/*-json.log
  pos_file /tmp/docker-containers.pos
  tag docker.*
  read_from_head false

  <parse>
    @type json
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%NZ
    keep_time_key true
  </parse>
</source>

# ──────────────────────────────────────────────────────────────
# Filter: enrich with container metadata from Docker log path
# ──────────────────────────────────────────────────────────────
<filter docker.**>
  @type record_transformer
  enable_ruby true
  <record>
    container_id ${tag_parts[1]}
    env production
    service sovren
    log_level ${record.dig("log", "level") || "info"}
  </record>
</filter>

# ──────────────────────────────────────────────────────────────
# Filter: parse nested JSON log field (Winston structured logs)
# Backend emits: {"log":"{\"level\":\"info\",\"message\":\"...\"}","stream":"stdout"}
# ──────────────────────────────────────────────────────────────
<filter docker.**>
  @type parser
  key_name log
  reserve_data true
  emit_invalid_record_to_error false
  <parse>
    @type json
  </parse>
</filter>

# ──────────────────────────────────────────────────────────────
# Output: stdout (development/debug view inside fluentd container)
# ──────────────────────────────────────────────────────────────
<match docker.**>
  @type copy

  # Always write to stdout for `docker logs sovren-fluentd`
  <store>
    @type stdout
    <format>
      @type json
    </format>
  </store>

  # Write structured logs to a rotating file inside the container
  # Mount a volume here to persist logs on the host if needed.
  <store>
    @type file
    path /tmp/sovren-logs
    append true
    <format>
      @type json
    </format>
    <buffer time>
      @type file
      path /tmp/fluentd-buffer
      timekey 1h
      timekey_wait 10m
      chunk_limit_size 256m
      total_limit_size 4g
      overflow_action block
    </buffer>
  </store>
</match>
