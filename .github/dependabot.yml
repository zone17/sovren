version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-dependencies:
        patterns: ['@types/*', 'eslint*', 'prettier*', 'vitest*', '@playwright/*', '@testing-library/*']
        update-types: ['minor', 'patch']
      production-dependencies:
        patterns: ['*']
        exclude-patterns: ['@types/*', 'eslint*', 'prettier*', 'vitest*', '@playwright/*', '@testing-library/*']
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ['ci']
    commit-message:
      prefix: 'ci(deps)'

  - package-ecosystem: docker
    directory: /packages/backend
    schedule:
      interval: weekly
    labels: ['dependencies', 'docker']
    commit-message:
      prefix: 'chore(docker)'

  - package-ecosystem: docker
    directory: /packages/frontend
    schedule:
      interval: weekly
    labels: ['dependencies', 'docker']
    commit-message:
      prefix: 'chore(docker)'
