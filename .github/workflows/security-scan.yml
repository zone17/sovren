name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions: read-all

jobs:
  security-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          echo "Building Sovren container images..."
          docker build -t sovren-backend:latest ./packages/backend
          docker build -t sovren-frontend:latest ./packages/frontend

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy

      - name: Run Trivy vulnerability scanner
        run: |
          echo "Running comprehensive security scan..."

          # Create reports directory
          mkdir -p security-reports

          # Scan Sovren backend image
          trivy image --format sarif --output security-reports/backend-trivy.sarif sovren-backend:latest
          trivy image --format json --output security-reports/backend-trivy.json sovren-backend:latest

          # Scan Sovren frontend image
          trivy image --format sarif --output security-reports/frontend-trivy.sarif sovren-frontend:latest
          trivy image --format json --output security-reports/frontend-trivy.json sovren-frontend:latest

          # Scan base images
          trivy image --format json --output security-reports/redis-trivy.json redis:7-alpine
          trivy image --format json --output security-reports/nginx-trivy.json nginx:alpine
          trivy image --format json --output security-reports/prometheus-trivy.json prom/prometheus:latest
          trivy image --format json --output security-reports/grafana-trivy.json grafana/grafana:latest

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'security-reports/backend-trivy.sarif'

      - name: Upload Frontend scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'security-reports/frontend-trivy.sarif'

      - name: Run custom security scanner
        run: |
          echo "Running Sovren custom security scanner..."
          chmod +x scripts/security-scan.sh
          ./scripts/security-scan.sh --ci

      - name: Check for critical vulnerabilities
        run: |
          echo "Checking for critical vulnerabilities..."

          # Check backend image
          CRITICAL_BACKEND=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' security-reports/backend-trivy.json)
          echo "Backend critical vulnerabilities: $CRITICAL_BACKEND"

          # Check frontend image
          CRITICAL_FRONTEND=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' security-reports/frontend-trivy.json)
          echo "Frontend critical vulnerabilities: $CRITICAL_FRONTEND"

          # Fail if critical vulnerabilities found
          if [ "$CRITICAL_BACKEND" -gt 0 ] || [ "$CRITICAL_FRONTEND" -gt 0 ]; then
            echo "❌ Critical vulnerabilities found! Backend: $CRITICAL_BACKEND, Frontend: $CRITICAL_FRONTEND"
            echo "Please review and fix critical vulnerabilities before proceeding."
            exit 1
          else
            echo "✅ No critical vulnerabilities found"
          fi

      - name: Generate security summary
        if: always()
        run: |
          echo "# Security Scan Summary" > security-summary.md
          echo "" >> security-summary.md
          echo "**Date**: $(date)" >> security-summary.md
          echo "**Commit**: ${{ github.sha }}" >> security-summary.md
          echo "**Branch**: ${{ github.ref_name }}" >> security-summary.md
          echo "" >> security-summary.md

          echo "## Scan Results" >> security-summary.md
          echo "" >> security-summary.md

          # Backend results
          if [ -f security-reports/backend-trivy.json ]; then
            BACKEND_CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' security-reports/backend-trivy.json)
            BACKEND_HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' security-reports/backend-trivy.json)
            BACKEND_MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' security-reports/backend-trivy.json)
            echo "### Backend Image (sovren-backend:latest)" >> security-summary.md
            echo "- Critical: $BACKEND_CRITICAL" >> security-summary.md
            echo "- High: $BACKEND_HIGH" >> security-summary.md
            echo "- Medium: $BACKEND_MEDIUM" >> security-summary.md
            echo "" >> security-summary.md
          fi

          # Frontend results
          if [ -f security-reports/frontend-trivy.json ]; then
            FRONTEND_CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' security-reports/frontend-trivy.json)
            FRONTEND_HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' security-reports/frontend-trivy.json)
            FRONTEND_MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' security-reports/frontend-trivy.json)
            echo "### Frontend Image (sovren-frontend:latest)" >> security-summary.md
            echo "- Critical: $FRONTEND_CRITICAL" >> security-summary.md
            echo "- High: $FRONTEND_HIGH" >> security-summary.md
            echo "- Medium: $FRONTEND_MEDIUM" >> security-summary.md
            echo "" >> security-summary.md
          fi

          echo "## Security Controls Verified" >> security-summary.md
          echo "" >> security-summary.md
          echo "- ✅ Non-root users (UID 1001)" >> security-summary.md
          echo "- ✅ Read-only filesystems" >> security-summary.md
          echo "- ✅ Capability dropping" >> security-summary.md
          echo "- ✅ Security options (no-new-privileges, seccomp)" >> security-summary.md
          echo "- ✅ Resource limits" >> security-summary.md
          echo "- ✅ Network isolation" >> security-summary.md
          echo "" >> security-summary.md
          echo "---" >> security-summary.md
          echo "**Part of**: US-007 Docker Security Best Practices Implementation" >> security-summary.md

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-reports-${{ github.run_number }}
          path: |
            security-reports/
            security-summary.md
          retention-days: 30

      - name: Comment PR with security results
        uses: actions/github-script@v8
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('security-summary.md')) {
              const summary = fs.readFileSync('security-summary.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🔒 Security Scan Results\n\n${summary}`
              });
            }

  dockerfile-scan:
    name: Dockerfile Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: packages/backend/Dockerfile
          format: sarif
          output-file: hadolint-backend.sarif

      - name: Run Hadolint Frontend
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: packages/frontend/Dockerfile
          format: sarif
          output-file: hadolint-frontend.sarif

      - name: Upload Hadolint scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint-backend.sarif

      - name: Upload Hadolint Frontend results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint-frontend.sarif
