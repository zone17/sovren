# Consolidated CI Pipeline for Sovren
# Replaces overlapping trigger workflows with a single entry point.
# Stages: lint -> security -> test -> build -> deploy-staging -> deploy-production

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ===========================================
  # Path Detection (determines which packages changed)
  # ===========================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'packages/backend/**'
              - 'packages/shared/**'
            frontend:
              - 'packages/frontend/**'
              - 'packages/shared/**'
            shared:
              - 'packages/shared/**'

  # ===========================================
  # Stage 1a: Lint (changed files only — incremental strictness)
  # ===========================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Get changed files
        id: changed
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            BASE="${{ github.event.merge_group.base_sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # Fallback: if BASE is empty or zeroed, diff against origin/main
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            BASE="origin/main"
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$FILES" | wc -w | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: ESLint (changed files)
        if: steps.changed.outputs.count != '0'
        run: npx eslint ${{ steps.changed.outputs.files }} --no-error-on-unmatched-pattern

      - name: Prettier (changed files)
        if: steps.changed.outputs.count != '0'
        run: npx prettier --check ${{ steps.changed.outputs.files }} --no-error-on-unmatched-pattern

      - name: No files changed
        if: steps.changed.outputs.count == '0'
        run: echo "No TS/JS files changed — lint skipped"

  # ===========================================
  # Stage 1b: Type Check (changed files only — incremental strictness)
  # ===========================================
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Get changed TS files
        id: changed
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            BASE="${{ github.event.merge_group.base_sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # Fallback: if BASE is empty or zeroed, diff against origin/main
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            BASE="origin/main"
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.ts' '*.tsx' | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$FILES" | wc -w | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: TypeScript (per-package)
        if: steps.changed.outputs.count != '0'
        run: |
          CHANGED="${{ steps.changed.outputs.files }}"
          ERRORS=0

          # Run tsc per package with correct path resolution
          for PKG in backend frontend; do
            TSCONFIG="packages/$PKG/tsconfig.json"
            if [ ! -f "$TSCONFIG" ]; then
              echo "Skipping $PKG — no tsconfig.json"
              continue
            fi
            TSC_OUTPUT=$(npx tsc -p "$TSCONFIG" --noEmit --pretty false 2>&1 || true)
            for FILE in $CHANGED; do
              FILE_ERRORS=$(echo "$TSC_OUTPUT" | grep "^$FILE(" || true)
              if [ -n "$FILE_ERRORS" ]; then
                echo "$FILE_ERRORS"
                ERRORS=$((ERRORS + 1))
              fi
            done
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Type errors found in changed files"
            exit 1
          fi
          echo "No type errors in changed files"

      - name: No files changed
        if: steps.changed.outputs.count == '0'
        run: echo "No TS files changed — type check skipped"

  # ===========================================
  # Stage 2: Security Scan (parallel with lint)
  # ===========================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: npm audit (production dependencies)
        run: npm audit --audit-level=high --omit=dev

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.31.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'

  # ===========================================
  # Stage 3: Backend Tests (conditional on changes)
  # ===========================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, lint, typecheck, security]
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sovren_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Backend unit tests
        run: npx vitest run --project backend
        env:
          NODE_ENV: test

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

  # ===========================================
  # Stage 3b: Frontend Tests (conditional on changes)
  # ===========================================
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, lint, typecheck, security]
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Frontend unit tests
        run: npx vitest run --project frontend
        env:
          NODE_ENV: test

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  # ===========================================
  # Stage 3c: Integration Tests (testcontainers — advisory during stabilization)
  # ===========================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, lint, typecheck, security]
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    # Advisory-only during stabilization — CI stays green even if these fail.
    # TODO: Remove continue-on-error after 5 consecutive green integration runs on main.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Pre-pull test container images
        run: docker pull postgres:16-alpine & docker pull redis:7-alpine & wait

      - name: Run integration tests (testcontainers)
        run: npm run test:integration
        env:
          NODE_ENV: test

  # ===========================================
  # Stage 3d: Test Gate (aggregator for required status check)
  # ===========================================
  test-gate:
    name: Test Gate
    runs-on: ubuntu-latest
    needs: [changes, test-backend, test-frontend, test-integration]
    if: always()
    steps:
      - name: Evaluate test results
        run: |
          # If path detection itself failed, we can't trust skipped results
          if [[ "${{ needs.changes.result }}" == "failure" || "${{ needs.changes.result }}" == "cancelled" ]]; then
            echo "Test gate FAILED — path detection (changes job) did not succeed"
            exit 1
          fi

          echo "Changes:     ${{ needs.changes.result }}"
          echo "Backend:     ${{ needs.test-backend.result }}"
          echo "Frontend:    ${{ needs.test-frontend.result }}"
          echo "Integration: ${{ needs.test-integration.result }} (advisory — continue-on-error)"

          # Blocking gates: backend + frontend must pass (or be skipped)
          blocking=(
            "${{ needs.test-backend.result }}"
            "${{ needs.test-frontend.result }}"
          )
          for result in "${blocking[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "Test gate FAILED — a blocking test job failed or was cancelled"
              exit 1
            fi
          done

          # Advisory: integration tests (continue-on-error) — log but don't block
          if [[ "${{ needs.test-integration.result }}" == "failure" ]]; then
            echo "::warning::Integration tests failed (advisory — not blocking merge)"
          fi

          echo "Test gate PASSED — all blocking test jobs succeeded or were skipped"

  # ===========================================
  # Stage 4: Build
  # ===========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-gate]

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          test -d packages/frontend/dist || { echo "Frontend build output missing"; exit 1; }
          test -f packages/frontend/dist/index.html || { echo "index.html missing"; exit 1; }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: packages/frontend/dist
          retention-days: 3

  # ===========================================
  # Stage 4b: E2E Tests (post-build, against production bundle)
  # ===========================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: packages/frontend/dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/frontend

      - name: Start preview server
        run: npx vite preview --port 4173 &
        working-directory: packages/frontend

      - name: Wait for preview server
        run: npx wait-on http://localhost:4173 --timeout 30000

      - name: Run E2E tests against production build
        run: npm run test:e2e
        working-directory: packages/frontend
        env:
          CI: true
          E2E_BASE_URL: http://localhost:4173

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/frontend/test-results/
          retention-days: 7

  # ===========================================
  # Stage 5: Docker Image Build & Security Scan
  # ===========================================
  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-gate]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./packages/backend
          file: ./packages/backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Trivy image scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          exit-code: '1'
          severity: 'CRITICAL'

  # ===========================================
  # Stage 6: Deploy Staging (main branch only)
  # ===========================================
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, docker, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.sovren.dev

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: packages/frontend/dist

      - name: Deploy frontend to Vercel (staging)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./packages/frontend
          alias-domains: staging.sovren.dev

      - name: Health check staging
        run: |
          for i in 1 2 3 4 5; do
            sleep 10
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://staging.sovren.dev" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Staging health check passed"
              exit 0
            fi
            echo "Attempt $i: HTTP $status"
          done
          echo "Staging health check failed after 5 attempts"
          exit 1

  # ===========================================
  # Stage 7: Deploy Production (manual approval)
  # ===========================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://sovren.dev

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: packages/frontend/dist

      - name: Deploy frontend to Vercel (production)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./packages/frontend
          vercel-args: '--prod'

      - name: Health check production
        run: |
          sleep 30
          for i in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://sovren.dev" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Production health check passed"
              exit 0
            fi
            echo "Attempt $i: HTTP $status"
            sleep 15
          done
          echo "Production health check failed"
          exit 1

      - name: Notify deployment
        if: always()
        uses: slackapi/slack-github-action@v2
        continue-on-error: true
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ job.status == 'success' && 'Production deployment successful' || 'Production deployment FAILED' }} - ${{ github.sha }}"
            }
