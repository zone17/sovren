# Consolidated CI Pipeline for Sovren
# Replaces overlapping trigger workflows with a single entry point.
# Stages: lint -> security -> test -> build -> deploy-staging -> deploy-production

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ===========================================
  # Stage 1: Code Quality (parallel)
  # ===========================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run type-check

  # ===========================================
  # Stage 2: Security Scan (parallel with lint)
  # ===========================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'

  # ===========================================
  # Stage 3: Tests
  # ===========================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, security]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sovren_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Unit tests with coverage
        run: npm run test:ci
        env:
          NODE_ENV: test

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  # ===========================================
  # Stage 3b: Integration Tests (parallel with unit tests)
  # ===========================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, security]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 54322:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6380:6379

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local
        run: supabase start
        env:
          SUPABASE_DB_PORT: 54322

      - name: Run integration tests
        run: npm run test:integration --workspace=packages/backend
        env:
          NODE_ENV: test
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU' }}
          REDIS_TEST_HOST: localhost
          REDIS_TEST_PORT: 6380

      - name: Upload integration coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./packages/backend/coverage/integration/lcov.info
          flags: integration
          fail_ci_if_error: false

  # ===========================================
  # Stage 4: Build
  # ===========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, test-integration]

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          test -d packages/frontend/dist || { echo "Frontend build output missing"; exit 1; }
          test -f packages/frontend/dist/index.html || { echo "index.html missing"; exit 1; }

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: packages/frontend/dist
          retention-days: 3

  # ===========================================
  # Stage 4b: E2E Tests (post-build, against production bundle)
  # ===========================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: packages/frontend/dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/frontend

      - name: Start preview server
        run: npx vite preview --port 4173 &
        working-directory: packages/frontend

      - name: Wait for preview server
        run: npx wait-on http://localhost:4173 --timeout 30000

      - name: Run E2E tests against production build
        run: npm run test:e2e
        working-directory: packages/frontend
        env:
          CI: true
          E2E_BASE_URL: http://localhost:4173

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: packages/frontend/test-results/
          retention-days: 7

  # ===========================================
  # Stage 5: Docker Image Build & Security Scan
  # ===========================================
  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, test-integration]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./packages/backend
          file: ./packages/backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Trivy image scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          exit-code: '1'
          severity: 'CRITICAL'

  # ===========================================
  # Stage 6: Deploy Staging (main branch only)
  # ===========================================
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, docker, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.sovren.dev

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: packages/frontend/dist

      - name: Deploy frontend to Vercel (staging)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./packages/frontend
          alias-domains: staging.sovren.dev

      - name: Health check staging
        run: |
          for i in 1 2 3 4 5; do
            sleep 10
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://staging.sovren.dev" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Staging health check passed"
              exit 0
            fi
            echo "Attempt $i: HTTP $status"
          done
          echo "Staging health check failed after 5 attempts"
          exit 1

  # ===========================================
  # Stage 7: Deploy Production (manual approval)
  # ===========================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://sovren.dev

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: packages/frontend/dist

      - name: Deploy frontend to Vercel (production)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./packages/frontend
          vercel-args: '--prod'

      - name: Health check production
        run: |
          sleep 30
          for i in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://sovren.dev" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Production health check passed"
              exit 0
            fi
            echo "Attempt $i: HTTP $status"
            sleep 15
          done
          echo "Production health check failed"
          exit 1

      - name: Notify deployment
        if: always()
        uses: slackapi/slack-github-action@v2
        continue-on-error: true
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ job.status == 'success' && 'Production deployment successful' || 'Production deployment FAILED' }} - ${{ github.sha }}"
            }
