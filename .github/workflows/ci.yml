# Consolidated CI Pipeline for Sovren
# Replaces overlapping trigger workflows with a single entry point.
# Stages: lint -> security -> test -> build -> deploy-staging -> deploy-production

name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'refactor/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ===========================================
  # Path Detection (determines which packages changed)
  # ===========================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: |
            backend:
              - 'packages/backend/**'
              - 'packages/shared/**'
            frontend:
              - 'packages/frontend/**'
              - 'packages/shared/**'
            shared:
              - 'packages/shared/**'

  # ===========================================
  # Stage 1a: Lint (changed files only — incremental strictness)
  # ===========================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Get changed files
        id: changed
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # Fallback: if BASE is empty or zeroed, diff against origin/main
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            BASE="origin/main"
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' | grep -v '\.test\.' | grep -v '__tests__' | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$FILES" | wc -w | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: ESLint (changed files)
        if: steps.changed.outputs.count != '0'
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: npx eslint $FILES --no-error-on-unmatched-pattern --max-warnings 500

      - name: Prettier (changed files)
        if: steps.changed.outputs.count != '0'
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: npx prettier --check $FILES --no-error-on-unmatched-pattern

      - name: No files changed
        if: steps.changed.outputs.count == '0'
        run: echo "No TS/JS files changed — lint skipped"

  # ===========================================
  # Stage 1b: Type Check (changed files only — incremental strictness)
  # ===========================================
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node

      - name: Get changed TS files
        id: changed
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # Fallback: if BASE is empty or zeroed, diff against origin/main
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            BASE="origin/main"
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.ts' '*.tsx' | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$FILES" | wc -w | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: TypeScript (per-package)
        if: steps.changed.outputs.count != '0'
        env:
          CHANGED: ${{ steps.changed.outputs.files }}
        run: |
          ERRORS=0

          # Run tsc per package with correct path resolution
          for PKG in backend frontend; do
            TSCONFIG="packages/$PKG/tsconfig.json"
            if [ ! -f "$TSCONFIG" ]; then
              echo "Skipping $PKG — no tsconfig.json"
              continue
            fi
            TSC_OUTPUT=$(npx tsc -p "$TSCONFIG" --noEmit --pretty false 2>&1 || true)
            for FILE in $CHANGED; do
              FILE_ERRORS=$(echo "$TSC_OUTPUT" | grep -F "$FILE(" || true)
              if [ -n "$FILE_ERRORS" ]; then
                echo "$FILE_ERRORS"
                ERRORS=$((ERRORS + 1))
              fi
            done
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Type errors found in changed files"
            exit 1
          fi
          echo "No type errors in changed files"

      - name: E2E type check
        if: steps.changed.outputs.count != '0'
        run: npx tsc -p packages/frontend/tsconfig.e2e.json --noEmit

      # Ratchet: @ts-nocheck count must only decrease. Baseline set in PR #146 (S9 buffer hardening).
      # To lower the threshold: grep -rn '@ts-nocheck' packages/ --include='*.ts' --include='*.tsx' | wc -l
      # Runs unconditionally — counts ALL files, not just changed ones.
      - name: '@ts-nocheck ratchet (max 0)'
        run: |
          COUNT=$(grep -rn '@ts-nocheck' packages/ --include='*.ts' --include='*.tsx' | wc -l | tr -d ' ')
          echo "@ts-nocheck count: $COUNT (threshold: 0)"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::@ts-nocheck count ($COUNT) exceeds ratchet threshold (0). Do not add @ts-nocheck — fix the type errors instead."
            exit 1
          fi

      - name: No files changed
        if: steps.changed.outputs.count == '0'
        run: echo "No TS files changed — type check skipped"

  # ===========================================
  # Stage 2: Security Scan (parallel with lint)
  # ===========================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-node

      - name: npm audit (production dependencies)
        run: npm audit --audit-level=critical --omit=dev || true
        # Known pre-existing: handlebars CLI precompiler CVEs (not runtime),
        # path-to-regexp ReDoS (pinned by Express, no fix without breaking).
        # Tracked in docs/legal/compliance-checklist-2026-03-28.md

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'
          trivyignores: '.trivyignore'
          version: 'v0.69.3'

  # ===========================================
  # Stage 2b: DB Migration Validation (P1-INFRA-003)
  # Validates that all migration files are syntactically valid SQL and
  # that migration filenames follow the expected timestamp ordering.
  # Runs on any backend or migration file change.
  # ===========================================
  validate-migrations:
    name: DB Migration Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, lint]
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sovren_migrate_test
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate migration filenames (timestamp ordering)
        run: |
          MIGRATIONS=$(ls supabase/migrations/*.sql 2>/dev/null | sort)
          if [ -z "$MIGRATIONS" ]; then
            echo "No migrations found — skipping ordering check"
            exit 0
          fi
          PREV=""
          ERRORS=0
          for f in $MIGRATIONS; do
            NAME=$(basename "$f")
            # Timestamp must be 14-digit prefix: YYYYMMDDHHMMSS
            TS=$(echo "$NAME" | grep -oE '^[0-9]{14}' || true)
            if [ -z "$TS" ]; then
              echo "::error file=$f::Migration filename must start with 14-digit timestamp: $NAME"
              ERRORS=$((ERRORS + 1))
              continue
            fi
            if [ -n "$PREV" ] && [ "$TS" -le "$PREV" ]; then
              echo "::error file=$f::Migration timestamp out of order: $NAME (prev=$PREV)"
              ERRORS=$((ERRORS + 1))
            fi
            PREV="$TS"
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::$ERRORS migration ordering error(s) found"
            exit 1
          fi
          echo "Migration filename ordering: OK"

      - name: Bootstrap Supabase-compatible schemas
        run: |
          DB_URL="postgresql://postgres:postgres@localhost:5432/sovren_migrate_test"
          # Supabase migrations reference auth.uid(), auth.role(), supabase_realtime etc.
          # Bootstrap these on vanilla postgres so migrations can dry-run.
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS "btree_gist";
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid AS $$ SELECT '00000000-0000-0000-0000-000000000000'::uuid; $$ LANGUAGE sql;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text AS $$ SELECT 'anon'::text; $$ LANGUAGE sql;
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END $$;
          CREATE PUBLICATION supabase_realtime;
          SQL
          echo "Supabase-compatible bootstrap complete"

      - name: Dry-run migrations against test database
        run: |
          DB_URL="postgresql://postgres:postgres@localhost:5432/sovren_migrate_test"
          MIGRATIONS=$(ls supabase/migrations/*.sql 2>/dev/null | sort)
          if [ -z "$MIGRATIONS" ]; then
            echo "No migrations found — skipping dry-run"
            exit 0
          fi
          ERRORS=0
          for f in $MIGRATIONS; do
            echo "Applying: $(basename $f)"
            if ! psql "$DB_URL" -f "$f" -v ON_ERROR_STOP=1 -q 2>&1; then
              echo "::error file=$f::Migration failed: $(basename $f)"
              ERRORS=$((ERRORS + 1))
              # Stop on first failure — later migrations depend on earlier ones
              break
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
          echo "All migrations applied successfully"

  # ===========================================
  # Stage 3: Backend Tests (conditional on changes)
  # ===========================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, lint, typecheck, security]
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sovren_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-node

      - name: Backend unit tests
        run: npx vitest run --project backend
        env:
          NODE_ENV: test

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

  # ===========================================
  # Stage 3b: Frontend Tests (conditional on changes)
  # ===========================================
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, lint, typecheck, security]
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-node

      - name: Frontend unit tests
        run: npx vitest run --project frontend
        env:
          NODE_ENV: test

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  # ===========================================
  # Stage 3c: Integration Tests (testcontainers — advisory during stabilization)
  # ===========================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, lint, typecheck, security]
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    # Graduation criteria (continue-on-error removal): 10 consecutive green runs on main
    # with no flaky test retries. Track via CI run history before permanently removing
    # continue-on-error if it is re-added. Current status: blocking (stable).
    # Graduation: Remove continue-on-error after 10 consecutive green runs on main. Track at: https://github.com/zone17/sovren/actions/workflows/ci.yml?query=branch%3Amain

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-node

      - name: Pre-pull test container images
        run: docker pull postgres:16-alpine & docker pull redis:7-alpine & wait

      - name: Run integration tests (testcontainers)
        run: npm run test:integration
        env:
          NODE_ENV: test

  # ===========================================
  # Stage 3d: Test Gate (aggregator for required status check)
  # ===========================================
  test-gate:
    name: Test Gate
    runs-on: ubuntu-latest
    needs: [changes, test-backend, test-frontend, test-integration, validate-migrations]
    if: always()
    steps:
      - name: Evaluate test results
        run: |
          # If path detection itself failed, we can't trust skipped results
          if [[ "${{ needs.changes.result }}" == "failure" || "${{ needs.changes.result }}" == "cancelled" ]]; then
            echo "Test gate FAILED — path detection (changes job) did not succeed"
            exit 1
          fi

          echo "Changes:     ${{ needs.changes.result }}"
          echo "Backend:     ${{ needs.test-backend.result }}"
          echo "Frontend:    ${{ needs.test-frontend.result }}"
          echo "Integration: ${{ needs.test-integration.result }}"
          echo "Migrations:  ${{ needs.validate-migrations.result }}"

          # Blocking gates: unit tests must pass. Integration + migrations are infra-dependent
          # and may fail on feature branches without Supabase/Docker credentials.
          blocking=(
            "${{ needs.test-backend.result }}"
            "${{ needs.test-frontend.result }}"
          )
          # Non-blocking infra gates (log but don't fail)
          if [[ "${{ needs.test-integration.result }}" == "failure" ]]; then
            echo "⚠️  Integration tests failed (needs Docker/testcontainers) — non-blocking on feature branches"
          fi
          if [[ "${{ needs.validate-migrations.result }}" == "failure" ]]; then
            echo "⚠️  Migration validation failed (needs Supabase CLI) — non-blocking on feature branches"
          fi
          for result in "${blocking[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "Test gate FAILED — a blocking test job failed or was cancelled"
              exit 1
            fi
          done

          echo "Test gate PASSED — all blocking test jobs succeeded or were skipped"

  # ===========================================
  # Stage 4: Build
  # ===========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-gate]
    if: always() && !cancelled() && needs.test-gate.result == 'success'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-node

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify build output
        run: |
          test -d packages/frontend/dist || { echo "Frontend build output missing"; exit 1; }
          test -f packages/frontend/dist/index.html || { echo "index.html missing"; exit 1; }

      - name: Verify JS chunks are non-empty
        run: |
          if [ -d "packages/frontend/dist/assets" ]; then
            EMPTY=$(find packages/frontend/dist/assets -name '*.js' -size -10c | wc -l | tr -d ' ')
            TOTAL=$(find packages/frontend/dist/assets -name '*.js' | wc -l | tr -d ' ')
            echo "JS chunks: $TOTAL total, $EMPTY empty (<10 bytes)"
            if [ "$EMPTY" -gt 5 ]; then
              echo "::error::$EMPTY of $TOTAL JS chunks are nearly empty — possible treeshake bug"
              exit 1
            fi
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: packages/frontend/dist
          retention-days: 3

  # ===========================================
  # Stage 4b: E2E Tests (post-build, against production bundle)
  # ===========================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    if: always() && !cancelled() && needs.build.result == 'success'
    # Graduation criteria (continue-on-error removal): 10 consecutive green runs on main
    # with no auth/fixture-related flakes. Track via CI run history before permanently
    # removing continue-on-error if it is re-added. Current status: blocking (stable).

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-node

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: packages/frontend/dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/frontend

      - name: Start preview server
        run: npx vite preview --port 4173 &
        working-directory: packages/frontend

      - name: Wait for preview server
        run: npx wait-on http://localhost:4173 --timeout 30000

      - name: Run E2E tests against production build
        run: npm run test:e2e
        working-directory: packages/frontend
        env:
          CI: true
          E2E_BASE_URL: http://localhost:4173
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          E2E_CREATOR_EMAIL: ${{ secrets.E2E_CREATOR_EMAIL }}
          E2E_CREATOR_PASSWORD: ${{ secrets.E2E_CREATOR_PASSWORD }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_SIGNUP_NAME: ${{ secrets.E2E_SIGNUP_NAME }}
          E2E_SIGNUP_EMAIL: ${{ secrets.E2E_SIGNUP_EMAIL }}
          E2E_SIGNUP_PASSWORD: ${{ secrets.E2E_SIGNUP_PASSWORD }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/frontend/test-results/
          retention-days: 7

  # ===========================================
  # Stage 5: Docker Image Build & Security Scan
  # ===========================================
  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-gate]
    if: github.event_name == 'push' && !cancelled() && needs.test-gate.result == 'success'

    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./packages/backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign container image
        continue-on-error: true  # OIDC token can expire during long builds
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        continue-on-error: true  # Non-blocking — SARIF upload is advisory
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          version: 'v0.69.3'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true  # Don't fail if SARIF file missing
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Trivy image scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          exit-code: '1'
          severity: 'CRITICAL'
          version: 'v0.69.3'

  # ===========================================
  # Stage 5b: Database Migration (main branch only)
  # ===========================================
  migrate:
    name: Database Migration
    needs: [build, test-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 1.6.0
      - name: Push migrations
        run: supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # ===========================================
  # Stage 6: Deploy Staging (main branch only)
  # ===========================================
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, e2e, migrate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.sovren.dev

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: packages/frontend/dist

      - name: Check Vercel secrets
        id: vercel-check
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Vercel secrets not configured — skipping frontend deploy"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy frontend to Vercel (staging)
        if: steps.vercel-check.outputs.available == 'true'
        uses: amondnet/vercel-action@16e87c0a08142b0d0d33b76aeaf20823c381b9b9 # v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./packages/frontend
          alias-domains: staging.sovren.dev

      - name: Health check staging
        if: steps.vercel-check.outputs.available == 'true'
        run: |
          for i in 1 2 3 4 5; do
            sleep 10
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://staging.sovren.dev" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Staging health check passed"
              exit 0
            fi
            echo "Attempt $i: HTTP $status"
          done
          echo "Staging health check failed after 5 attempts"
          exit 1

      - name: Backend health check staging
        run: |
          for i in 1 2 3 4 5; do
            sleep 10
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://api-staging.sovren.dev/health" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Staging API health check passed"
              exit 0
            fi
            echo "Attempt $i: API HTTP $status"
          done
          echo "Staging API health check failed after 5 attempts"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "::error::Health check failed — initiating rollback"
          npx vercel rollback --token ${{ secrets.VERCEL_TOKEN }} --yes 2>/dev/null || echo "Vercel rollback skipped (no token or no previous deployment)"

  # ===========================================
  # Stage 6b: Deploy Backend Staging (P1-INFRA-004)
  # Automated backend deployment — pulls the image built by the docker job
  # and deploys it to the staging Docker host via SSH.
  # Requires secrets: STAGING_SSH_HOST, STAGING_SSH_USER, STAGING_SSH_KEY,
  #                   STAGING_DEPLOY_PATH (default: /opt/sovren)
  # ===========================================
  deploy-backend-staging:
    name: Deploy Backend (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [deploy-staging, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://api-staging.sovren.dev

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check SSH secrets
        id: ssh-check
        run: |
          if [ -n "$SSH_HOST" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SSH deployment secrets not configured — skipping backend deploy"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}

      - name: Deploy backend image to staging host
        if: steps.ssh-check.outputs.available == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.STAGING_DEPLOY_PATH || '/opt/sovren' }}"
            IMAGE="${{ needs.docker.outputs.image_tag }}"
            DIGEST="${{ needs.docker.outputs.image_digest }}"

            echo "Deploying backend image: $IMAGE"
            echo "Digest: $DIGEST"

            # Pull the new image (pinned by digest for reproducibility)
            docker pull "ghcr.io/${{ github.repository }}/backend@${DIGEST}"

            # Atomic blue-green swap: update image reference in compose override
            cd "$DEPLOY_PATH"
            cat > docker-compose.staging-override.yml <<EOF
            services:
              backend:
                image: "ghcr.io/${{ github.repository }}/backend@${DIGEST}"
            EOF

            # Rolling restart: bring up new containers before stopping old ones
            docker compose -f docker-compose.prod.yml \
                           -f docker-compose.staging-override.yml \
                           up -d --no-deps --pull never backend

            # Wait for health check to pass
            for i in 1 2 3 4 5 6; do
              sleep 10
              STATUS=$(curl -sf http://localhost:3001/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null || echo "error")
              if [ "$STATUS" = "healthy" ]; then
                echo "Backend health check passed"
                exit 0
              fi
              echo "Attempt $i: status=$STATUS"
            done
            echo "Backend health check failed after 60s — rolling back"
            docker compose -f docker-compose.prod.yml up -d --no-deps backend
            exit 1

      - name: Verify backend API health (external)
        if: steps.ssh-check.outputs.available == 'true'
        run: |
          for i in 1 2 3 4 5; do
            sleep 5
            STATUS=$(curl -sf https://api-staging.sovren.dev/health | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "healthy" ]; then
              echo "External backend health check passed"
              exit 0
            fi
            echo "Attempt $i: $STATUS"
          done
          echo "::warning::External backend health check failed — check staging deployment"

  # ===========================================
  # Stage 7: Deploy Production (manual approval)
  # ===========================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://sovren.dev

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: packages/frontend/dist

      - name: Check Vercel secrets (production)
        id: vercel-check-prod
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Vercel secrets not configured — skipping production frontend deploy"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy frontend to Vercel (production)
        if: steps.vercel-check-prod.outputs.available == 'true'
        id: deploy
        uses: amondnet/vercel-action@16e87c0a08142b0d0d33b76aeaf20823c381b9b9 # v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./packages/frontend
          vercel-args: '--prod'

      - name: Health check production
        if: steps.vercel-check-prod.outputs.available == 'true'
        run: |
          sleep 30
          for i in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://sovren.dev" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Production health check passed"
              exit 0
            fi
            echo "Attempt $i: HTTP $status"
            sleep 15
          done
          echo "Production health check failed"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "::error::Health check failed — initiating rollback"
          npx vercel rollback --token ${{ secrets.VERCEL_TOKEN }} --yes 2>/dev/null || echo "Vercel rollback skipped (no token or no previous deployment)"

      - name: Notify deployment
        if: always()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2
        continue-on-error: true
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ job.status == 'success' && 'Production deployment successful' || 'Production deployment FAILED' }} - ${{ github.sha }}"
            }

  # ===========================================
  # Stage 7b: Deploy Backend Production (P1-INFRA-004)
  # Manual-approval production backend deployment.
  # Mirrors staging deploy — same image promoted (no rebuild).
  # Requires secrets: PROD_SSH_HOST, PROD_SSH_USER, PROD_SSH_KEY,
  #                   PROD_DEPLOY_PATH (default: /opt/sovren)
  # ===========================================
  deploy-backend-production:
    name: Deploy Backend (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [deploy-production, deploy-backend-staging, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://api.sovren.dev

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check SSH secrets (production)
        id: ssh-check-prod
        run: |
          if [ -n "$SSH_HOST" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Production SSH secrets not configured — skipping backend deploy"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}

      - name: Deploy backend image to production host
        if: steps.ssh-check-prod.outputs.available == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.PROD_DEPLOY_PATH || '/opt/sovren' }}"
            DIGEST="${{ needs.docker.outputs.image_digest }}"

            echo "Promoting staging image to production: digest=$DIGEST"

            docker pull "ghcr.io/${{ github.repository }}/backend@${DIGEST}"

            cd "$DEPLOY_PATH"
            cat > docker-compose.prod-override.yml <<EOF
            services:
              backend:
                image: "ghcr.io/${{ github.repository }}/backend@${DIGEST}"
            EOF

            docker compose -f docker-compose.prod.yml \
                           -f docker-compose.prod-override.yml \
                           up -d --no-deps --pull never backend

            for i in 1 2 3 4 5 6; do
              sleep 10
              STATUS=$(curl -sf http://localhost:3001/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null || echo "error")
              if [ "$STATUS" = "healthy" ]; then
                echo "Production backend health check passed"
                exit 0
              fi
              echo "Attempt $i: status=$STATUS"
            done
            echo "Production backend health check FAILED — rolling back"
            docker compose -f docker-compose.prod.yml up -d --no-deps backend
            exit 1

      - name: Verify production backend API health (external)
        if: steps.ssh-check-prod.outputs.available == 'true'
        run: |
          for i in 1 2 3 4 5; do
            sleep 5
            STATUS=$(curl -sf https://api.sovren.dev/health | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "healthy" ]; then
              echo "External production health check passed"
              exit 0
            fi
            echo "Attempt $i: $STATUS"
          done
          echo "::warning::External production backend health check failed — check production deployment"

      - name: Notify backend deployment
        if: always()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2
        continue-on-error: true
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ job.status == 'success' && 'Backend production deployment successful' || 'Backend production deployment FAILED' }} - ${{ github.sha }}"
            }

  # ===========================================
  # CI Complete — fan-in gate for branch protection
  # ===========================================
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, test-gate, build, e2e, docker]
    if: always()
    steps:
      - name: Evaluate results
        run: |
          # Check all jobs — skipped is OK (conditional jobs), failure/cancelled is not
          declare -A results=(
            [lint]="${{ needs.lint.result }}"
            [typecheck]="${{ needs.typecheck.result }}"
            [security]="${{ needs.security.result }}"
            [test-gate]="${{ needs.test-gate.result }}"
            [build]="${{ needs.build.result }}"
            [e2e]="${{ needs.e2e.result }}"
            [docker]="${{ needs.docker.result }}"
          )

          # On main, cancellation is caused by concurrency groups when multiple
          # PRs merge in quick succession — not by code failures. Treat cancelled
          # as acceptable on main so CI Complete doesn't block the merge queue.
          IS_MAIN="${{ github.ref == 'refs/heads/main' }}"

          FAILED=0
          for job in "${!results[@]}"; do
            result="${results[$job]}"
            if [[ "$result" == "failure" ]]; then
              echo "::error::CI failed — job '$job' reported: $result"
              FAILED=1
            elif [[ "$result" == "cancelled" ]]; then
              if [[ "$IS_MAIN" == "true" ]]; then
                echo "::warning::Job '$job' was cancelled (concurrency on main) — not treated as failure"
              else
                echo "::error::CI failed — job '$job' reported: $result"
                FAILED=1
              fi
            fi
          done
          if [[ "$FAILED" == "1" ]]; then
            exit 1
          fi
          echo "All CI jobs passed or were skipped"

  # ===========================================
  # CodeQL SAST (main push + workflow_dispatch only, not PRs — too slow)
  # Not in ci-complete gate — advisory, results go to GitHub Security tab.
  # ===========================================
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-node
      - uses: github/codeql-action/init@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/autobuild@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
      - uses: github/codeql-action/analyze@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
