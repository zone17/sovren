name: Quality Gates

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:

permissions: read-all

env:
  NODE_VERSION: '20'
  CACHE_VERSION: v1

jobs:
  # Code Quality Checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Run Prettier check
        run: npm run format:check
        continue-on-error: false

      - name: TypeScript type checking
        run: npm run type-check
        continue-on-error: false

      - name: Check for circular dependencies
        run: npx madge --circular --extensions ts,tsx,js,jsx packages/frontend/src/ packages/backend/src/ packages/shared/src/
        continue-on-error: false

      - name: Run anti-pattern scanner
        if: github.event_name == 'pull_request'
        run: |
          # Run the anti-pattern scanner against files changed in this PR
          # In CI context, scan all source files (not just staged)
          ERRORS=0

          # Check 1: Unsafe 'any' types in source TypeScript files (exclude tests)
          MATCHES=$(grep -rHnE '(\bas\s+any\b|:\s*any\b|<any>|<any\[)' \
            packages/*/src/ \
            --include='*.ts' --include='*.tsx' \
            --exclude-dir='__tests__' \
            --exclude='*.test.ts' --exclude='*.spec.ts' \
            | grep -v '^\s*//' || true)
          if [ -n "$MATCHES" ]; then
            echo "Warning: Unsafe 'any' type usage found:"
            echo "$MATCHES" | head -20
            COUNT=$(echo "$MATCHES" | wc -l)
            echo "($COUNT total occurrences)"
            # Non-blocking for now — existing code has many instances
          fi

          # Check 2: Route files using req.body without validation
          ROUTE_FILES=$(find packages/*/src/ -path '*/routes/*' -name '*.ts' 2>/dev/null || true)
          for f in $ROUTE_FILES; do
            HAS_BODY=$(grep -c 'req\.body' "$f" 2>/dev/null || echo 0)
            HAS_VALIDATE=$(grep -cE 'validateRequest|zodValidate|\bvalidate\b|\.safeParse|\.parse\(' "$f" 2>/dev/null || echo 0)
            if [ "$HAS_BODY" -gt 0 ] && [ "$HAS_VALIDATE" -eq 0 ]; then
              echo "Anti-pattern: $f uses req.body without validation"
              ERRORS=$((ERRORS + 1))
            fi
          done

          # Check 3: Mutation routes without rate limiter
          for f in $ROUTE_FILES; do
            HAS_MUTATION=$(grep -cE '\.(post|put|delete)\(' "$f" 2>/dev/null || echo 0)
            HAS_LIMITER=$(grep -cE 'rateLimiter|RateLimiter' "$f" 2>/dev/null || echo 0)
            if [ "$HAS_MUTATION" -gt 0 ] && [ "$HAS_LIMITER" -eq 0 ]; then
              echo "Anti-pattern: $f has mutation routes without rate limiter"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "Found $ERRORS anti-pattern(s). See docs/solutions/PREVENTION_CODE_PATTERNS.md"
            exit 1
          fi

          echo "Anti-pattern scan passed"

  # Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Run Snyk security scan
        if: ${{ secrets.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: ['20', '22']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Run unit tests
        run: npm run test:unit
        env:
          CI: true
          NODE_ENV: test

      - name: Generate coverage report
        run: npm run test:coverage
        env:
          CI: true
          NODE_ENV: test

      - name: Upload coverage to Codecov
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Coverage threshold check
        run: npm run test:coverage:check
        env:
          CI: true

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: sovren_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Run integration tests
        run: npm run test:integration
        env:
          CI: true
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sovren_test
          REDIS_URL: redis://localhost:6379

  # End-to-End Tests
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Start application
        run: npm run start:test &
        env:
          NODE_ENV: test
          PORT: 3000

      - name: Wait for application
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - name: Upload E2E test results
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Performance Tests
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run Lighthouse CI
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        continue-on-error: true

  # Build Verification
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        environment: [development, production]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Build for ${{ matrix.environment }}
        run: npm run build
        env:
          NODE_ENV: ${{ matrix.environment }}

      - name: Verify build output
        run: |
          if [ ! -d "packages/frontend/dist" ]; then
            echo "Build output directory not found"
            exit 1
          fi

          if [ ! -f "packages/frontend/dist/index.html" ]; then
            echo "Main HTML file not found in build output"
            exit 1
          fi

      - name: Bundle size analysis
        run: npx bundlesize
        continue-on-error: true

  # Docker Build Test
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./packages/backend
          file: ./packages/backend/Dockerfile
          push: false
          tags: sovren-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./packages/frontend
          file: ./packages/frontend/Dockerfile
          push: false
          tags: sovren-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker images
        run: |
          docker run --rm -d --name backend-test -p 8080:8080 sovren-backend:test
          docker run --rm -d --name frontend-test -p 3000:3000 sovren-frontend:test

          sleep 10

          # Health checks
          curl -f http://localhost:8080/health || exit 1
          curl -f http://localhost:3000 || exit 1

          docker stop backend-test frontend-test

  # Documentation Check
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate changelog updated (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          # Check if CHANGELOG.md was modified in this PR
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- CHANGELOG.md || true)
          if [ -z "$CHANGED" ]; then
            echo "Warning: CHANGELOG.md was not updated in this PR"
            echo "Please add a changelog entry for your changes"
            # Non-blocking for now — change to exit 1 to enforce
          else
            echo "CHANGELOG.md updated"
          fi

      - name: Check required docs exist
        run: |
          for f in CHANGELOG.md README.md docs/README.md; do
            if [ ! -f "$f" ]; then
              echo "Missing required documentation file: $f"
              exit 1
            fi
          done
          echo "All required documentation files present"

  # Quality Gate Summary
  quality-gate:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs:
      [
        code-quality,
        security,
        unit-tests,
        integration-tests,
        e2e-tests,
        performance,
        build,
        docker,
        documentation,
      ]
    if: always()

    steps:
      - name: Check quality gate status
        id: gate-check
        run: |
          FAILED=0

          # Required gates — must pass
          for gate in code-quality security unit-tests integration-tests build documentation; do
            result="${{ needs.code-quality.result }}"
            case "$gate" in
              code-quality) result="${{ needs.code-quality.result }}" ;;
              security) result="${{ needs.security.result }}" ;;
              unit-tests) result="${{ needs.unit-tests.result }}" ;;
              integration-tests) result="${{ needs.integration-tests.result }}" ;;
              build) result="${{ needs.build.result }}" ;;
              documentation) result="${{ needs.documentation.result }}" ;;
            esac
            if [[ "$result" != "success" ]]; then
              echo "FAIL: $gate ($result)"
              FAILED=$((FAILED + 1))
            else
              echo "PASS: $gate"
            fi
          done

          # Optional gates — report but do not block
          for gate in e2e-tests performance docker; do
            result=""
            case "$gate" in
              e2e-tests) result="${{ needs.e2e-tests.result }}" ;;
              performance) result="${{ needs.performance.result }}" ;;
              docker) result="${{ needs.docker.result }}" ;;
            esac
            if [[ "$result" != "success" ]]; then
              echo "WARN: $gate ($result) — non-blocking"
            else
              echo "PASS: $gate"
            fi
          done

          if [[ "$FAILED" -gt 0 ]]; then
            echo ""
            echo "$FAILED required gate(s) failed"
            exit 1
          fi

          echo ""
          echo "All required quality gates passed!"

      - name: Update PR status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const gatePassed = '${{ steps.gate-check.outcome }}' === 'success';
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: gatePassed ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: gatePassed ? 'All quality gates passed' : 'Quality gates failed',
              context: 'Quality Gates'
            });

# Concurrency control
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
