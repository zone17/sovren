name: 🔐 Validate Deployment Secrets

on:
  # Manual trigger for ad-hoc validation
  workflow_dispatch:

  # Scheduled validation (weekly on Sunday at midnight)
  schedule:
    - cron: '0 0 * * 0'

  # Run after secrets are modified (via repository_dispatch)
  repository_dispatch:
    types: [secrets-updated]

# Prevent concurrent runs
concurrency:
  group: validate-secrets
  cancel-in-progress: false

env:
  NODE_VERSION: '18.x'

jobs:
  # ================================================
  # JOB 1: Check Required Secrets Exist
  # ================================================
  check-secrets-exist:
    name: 📋 Check Required Secrets Exist
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Validate Production Secrets
        env:
          # Infrastructure
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

          # Database
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}

          # Authentication
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

          # External Services
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          # NOSTR & Lightning
          NOSTR_RELAY_SECRET: ${{ secrets.NOSTR_RELAY_SECRET }}
          LIGHTNING_NODE_MACAROON: ${{ secrets.LIGHTNING_NODE_MACAROON }}
          LIGHTNING_NODE_TLS_CERT: ${{ secrets.LIGHTNING_NODE_TLS_CERT }}
          LIGHTNING_NODE_URL: ${{ secrets.LIGHTNING_NODE_URL }}

        run: |
          echo "🔍 Validating Production Secrets"
          ./scripts/validate-deployment-secrets.sh production

      - name: 🔍 Validate Staging Secrets
        env:
          # Staging secrets (with _STAGING suffix)
          VERCEL_TOKEN_STAGING: ${{ secrets.VERCEL_TOKEN_STAGING }}
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
          SUPABASE_URL_STAGING: ${{ secrets.SUPABASE_URL_STAGING }}
          SUPABASE_ANON_KEY_STAGING: ${{ secrets.SUPABASE_ANON_KEY_STAGING }}
          SUPABASE_SERVICE_ROLE_KEY_STAGING: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STAGING }}
          REDIS_URL_STAGING: ${{ secrets.REDIS_URL_STAGING }}
          JWT_SECRET_STAGING: ${{ secrets.JWT_SECRET_STAGING }}
          SESSION_SECRET_STAGING: ${{ secrets.SESSION_SECRET_STAGING }}
          SLACK_WEBHOOK_URL_STAGING: ${{ secrets.SLACK_WEBHOOK_URL_STAGING }}
          SENTRY_DSN_STAGING: ${{ secrets.SENTRY_DSN_STAGING }}
          LIGHTNING_NODE_MACAROON_STAGING: ${{ secrets.LIGHTNING_NODE_MACAROON_STAGING }}
          LIGHTNING_NODE_URL_STAGING: ${{ secrets.LIGHTNING_NODE_URL_STAGING }}

        run: |
          echo "🔍 Validating Staging Secrets"
          ./scripts/validate-deployment-secrets.sh staging

      - name: 📊 Generate Secrets Report
        if: always()
        run: |
          echo "## 🔐 Secrets Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f secrets-validation-report.txt ]; then
            cat secrets-validation-report.txt >> $GITHUB_STEP_SUMMARY
          fi

  # ================================================
  # JOB 2: Test Secret Connectivity
  # ================================================
  test-connectivity:
    name: 🔌 Test Secret Connectivity
    runs-on: ubuntu-latest
    needs: check-secrets-exist
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🧪 Test Vercel API Connection
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "🧪 Testing Vercel API..."
          # Install Vercel CLI
          npm install -g vercel

          # Test authentication
          if vercel whoami --token "$VERCEL_TOKEN" &>/dev/null; then
            echo "✅ Vercel API connection successful"
          else
            echo "❌ Vercel API connection failed"
            exit 1
          fi

      - name: 🧪 Test Database Connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "🧪 Testing Database connection..."
          # Install PostgreSQL client
          sudo apt-get update
          sudo apt-get install -y postgresql-client

          # Test connection
          if psql "$DATABASE_URL" -c "SELECT 1;" &>/dev/null; then
            echo "✅ Database connection successful"
          else
            echo "⚠️  Database connection failed (may be firewall restricted)"
            # Don't fail the job - database may be IP-restricted
          fi

      - name: 🧪 Test Redis Connection
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          echo "🧪 Testing Redis connection..."
          # Install Redis client
          sudo apt-get install -y redis-tools

          # Test connection
          if redis-cli -u "$REDIS_URL" ping | grep -q "PONG"; then
            echo "✅ Redis connection successful"
          else
            echo "⚠️  Redis connection failed (may be IP-restricted)"
            # Don't fail - Redis may be IP-restricted
          fi

      - name: 🧪 Test Slack Webhook
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "🧪 Testing Slack webhook..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H 'Content-type: application/json' \
            --data '{"text":"🔐 Secrets validation test from GitHub Actions"}' \
            "$SLACK_WEBHOOK_URL")

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Slack webhook successful (check #deployments channel)"
          else
            echo "❌ Slack webhook failed (HTTP $RESPONSE)"
            exit 1
          fi

      - name: 🧪 Test Sentry DSN
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          echo "🧪 Testing Sentry DSN..."
          # Extract public key and project ID from DSN
          if [[ "$SENTRY_DSN" =~ ^https://([^@]+)@([^/]+)/(.+)$ ]]; then
            echo "✅ Sentry DSN format valid"
          else
            echo "❌ Sentry DSN format invalid"
            exit 1
          fi

      - name: 🧪 Test Supabase Connection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "🧪 Testing Supabase connection..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/")

          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "404" ]; then
            echo "✅ Supabase connection successful"
          else
            echo "❌ Supabase connection failed (HTTP $RESPONSE)"
            exit 1
          fi

  # ================================================
  # JOB 3: Validate Secret Formats
  # ================================================
  validate-formats:
    name: 🔍 Validate Secret Formats
    runs-on: ubuntu-latest
    needs: check-secrets-exist
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Validate JWT_SECRET Length
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          echo "🔍 Validating JWT_SECRET length..."
          LENGTH=${#JWT_SECRET}

          if [ $LENGTH -ge 64 ]; then
            echo "✅ JWT_SECRET length valid ($LENGTH characters)"
          else
            echo "❌ JWT_SECRET too short ($LENGTH characters, minimum 64)"
            exit 1
          fi

      - name: 🔍 Validate SESSION_SECRET Length
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          echo "🔍 Validating SESSION_SECRET length..."
          LENGTH=${#SESSION_SECRET}

          if [ $LENGTH -ge 64 ]; then
            echo "✅ SESSION_SECRET length valid ($LENGTH characters)"
          else
            echo "❌ SESSION_SECRET too short ($LENGTH characters, minimum 64)"
            exit 1
          fi

      - name: 🔍 Validate ENCRYPTION_KEY Length
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          echo "🔍 Validating ENCRYPTION_KEY length..."
          LENGTH=${#ENCRYPTION_KEY}

          if [ $LENGTH -eq 64 ]; then
            echo "✅ ENCRYPTION_KEY length valid (64 characters)"
          else
            echo "❌ ENCRYPTION_KEY invalid length ($LENGTH characters, must be exactly 64)"
            exit 1
          fi

      - name: 🔍 Validate URL Formats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "🔍 Validating URL formats..."

          # Supabase URL
          if [[ "$SUPABASE_URL" =~ ^https://.*\.supabase\.co$ ]]; then
            echo "✅ SUPABASE_URL format valid"
          else
            echo "❌ SUPABASE_URL format invalid (should be https://project.supabase.co)"
            exit 1
          fi

          # Redis URL
          if [[ "$REDIS_URL" =~ ^redis(s)?://.*$ ]]; then
            echo "✅ REDIS_URL format valid"
          else
            echo "❌ REDIS_URL format invalid (should start with redis:// or rediss://)"
            exit 1
          fi

          # Database URL
          if [[ "$DATABASE_URL" =~ ^postgresql://.*$ ]]; then
            echo "✅ DATABASE_URL format valid"
          else
            echo "❌ DATABASE_URL format invalid (should start with postgresql://)"
            exit 1
          fi

          # Slack Webhook
          if [[ "$SLACK_WEBHOOK_URL" =~ ^https://hooks\.slack\.com/.*$ ]]; then
            echo "✅ SLACK_WEBHOOK_URL format valid"
          else
            echo "❌ SLACK_WEBHOOK_URL format invalid"
            exit 1
          fi

  # ================================================
  # JOB 4: Security Checks
  # ================================================
  security-checks:
    name: 🔒 Security Checks
    runs-on: ubuntu-latest
    needs: check-secrets-exist
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔒 Check for Insecure Defaults
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          echo "🔒 Checking for insecure defaults..."

          # Check for common insecure values
          INSECURE_PATTERNS=(
            "secret"
            "password"
            "changeme"
            "default"
            "test123"
            "admin"
            "12345"
          )

          ISSUES_FOUND=0

          for pattern in "${INSECURE_PATTERNS[@]}"; do
            if [[ "$JWT_SECRET" == *"$pattern"* ]]; then
              echo "❌ JWT_SECRET contains insecure pattern: $pattern"
              ISSUES_FOUND=1
            fi
          done

          if [ $ISSUES_FOUND -eq 0 ]; then
            echo "✅ No insecure default patterns detected"
          else
            echo "❌ Insecure secrets detected - rotate immediately!"
            exit 1
          fi

      - name: 🔒 Validate TLS Usage
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "🔒 Validating TLS usage..."

          # Redis should use TLS in production
          if [[ "$REDIS_URL" =~ ^rediss:// ]]; then
            echo "✅ Redis using TLS (rediss://)"
          else
            echo "⚠️  Warning: Redis not using TLS (consider using rediss://)"
          fi

          # Database should use SSL
          if [[ "$DATABASE_URL" =~ sslmode=require ]]; then
            echo "✅ Database requires SSL"
          else
            echo "⚠️  Warning: Database SSL not required (add ?sslmode=require)"
          fi

  # ================================================
  # JOB 5: Report & Notify
  # ================================================
  report:
    name: 📊 Generate Report & Notify
    runs-on: ubuntu-latest
    needs:
      [
        check-secrets-exist,
        test-connectivity,
        validate-formats,
        security-checks,
      ]
    if: always()
    timeout-minutes: 5

    steps:
      - name: 📊 Generate Summary
        run: |
          echo "## 🔐 Secrets Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Run**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.check-secrets-exist.result }}" = "success" ]; then
            echo "- ✅ Required secrets exist" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Missing required secrets" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-connectivity.result }}" = "success" ]; then
            echo "- ✅ Connectivity tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️  Some connectivity tests failed (may be IP-restricted)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.validate-formats.result }}" = "success" ]; then
            echo "- ✅ Secret formats valid" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Invalid secret formats detected" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.security-checks.result }}" = "success" ]; then
            echo "- ✅ Security checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Security issues detected" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📢 Notify Team on Failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{
              \"text\": \"🔐 Secrets Validation Failed\",
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": {
                    \"type\": \"plain_text\",
                    \"text\": \"🔐 Secrets Validation Failed\"
                  }
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {
                      \"type\": \"mrkdwn\",
                      \"text\": \"*Workflow:*\nValidate Deployment Secrets\"
                    },
                    {
                      \"type\": \"mrkdwn\",
                      \"text\": \"*Status:*\nFailed\"
                    },
                    {
                      \"type\": \"mrkdwn\",
                      \"text\": \"*Run:*\n#${{ github.run_number }}\"
                    },
                    {
                      \"type\": \"mrkdwn\",
                      \"text\": \"*Time:*\n$(date -u +'%Y-%m-%d %H:%M UTC')\"
                    }
                  ]
                },
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"⚠️ Action required: Review failed checks and update secrets as needed.\"
                  }
                },
                {
                  \"type\": \"actions\",
                  \"elements\": [
                    {
                      \"type\": \"button\",
                      \"text\": {
                        \"type\": \"plain_text\",
                        \"text\": \"View Workflow Run\"
                      },
                      \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                    }
                  ]
                }
              ]
            }"

      - name: 🎉 Notify Team on Success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{\"text\":\"✅ Secrets validation passed - all secrets configured correctly\"}"

      - name: ❌ Fail Workflow if Critical Issues
        if: needs.check-secrets-exist.result == 'failure' || needs.validate-formats.result == 'failure' || needs.security-checks.result == 'failure'
        run: |
          echo "❌ Critical validation failures detected"
          echo "Review the workflow logs and update secrets immediately"
          exit 1
