name: 'Setup Node.js'
description: 'Setup Node.js with node_modules caching for npm workspaces'

inputs:
  install-deps:
    description: 'Install npm dependencies'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Read .nvmrc
      id: nvmrc
      shell: bash
      run: echo "version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

    - name: Setup Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      with:
        node-version: ${{ steps.nvmrc.outputs.version }}

    - name: Cache node_modules
      if: inputs.install-deps == 'true'
      id: cache
      uses: actions/cache@d4323d4df104b026a6aa633fce6c52ec4527e2af # v4.2.2
      with:
        path: |
          node_modules
          packages/*/node_modules
        key: node-modules-${{ runner.os }}-node${{ steps.nvmrc.outputs.version }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          node-modules-${{ runner.os }}-node${{ steps.nvmrc.outputs.version }}-

    - name: Install dependencies
      if: inputs.install-deps == 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --no-audit
