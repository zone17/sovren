name: Tana Project Sync

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-tana:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Sync with Tana
        env:
          TANA_TOKEN: ${{ secrets.TANA_TOKEN }}
        run: |
          node scripts/tana-project-controller.js sync

      - name: Update milestone progress
        if: github.ref == 'refs/heads/main'
        env:
          TANA_TOKEN: ${{ secrets.TANA_TOKEN }}
        run: |
          node scripts/tana-project-controller.js report weekly
