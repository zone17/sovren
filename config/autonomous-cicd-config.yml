# Autonomous CI/CD Configuration
# Complete configuration for US-163 through US-166 implementations

# ===============================================
# AUTONOMOUS CI/CD PIPELINE CONFIGURATION
# ===============================================

pipeline:
  optimization_modes:
    adaptive:
      aggression: 0.5
      stability: 0.8
      description: 'Balanced optimization with safety'
    aggressive:
      aggression: 0.9
      stability: 0.3
      description: 'Maximum speed, minimal safety checks'
    conservative:
      aggression: 0.2
      stability: 0.95
      description: 'Maximum safety, slower execution'
    experimental:
      aggression: 1.0
      stability: 0.1
      description: 'Cutting-edge features, high risk'

  risk_thresholds:
    low: 0.2
    medium: 0.5
    high: 0.8
    critical: 0.95

  performance_targets:
    build_time: 300 # 5 minutes
    test_time: 600 # 10 minutes
    deployment_time: 180 # 3 minutes
    failure_rate: 0.05 # 5%

  ai_settings:
    strategy_learning: true
    performance_prediction: true
    failure_prediction: true
    auto_optimization: true
    learning_rate: 0.1

# ===============================================
# INTELLIGENT PRE-COMMIT HOOKS CONFIGURATION
# ===============================================

pre_commit_hooks:
  style_enforcement:
    enabled: true
    ai_learning: true
    auto_fix: true
    strictness: 0.8

  security_scanning:
    enabled: true
    vulnerability_threshold: 'medium'
    auto_fix: false
    ai_analysis: true

  performance_analysis:
    enabled: true
    complexity_threshold: 10
    performance_budget: true
    ai_optimization: true

  test_validation:
    enabled: true
    coverage_threshold: 0.8
    intelligent_selection: true
    auto_generation: true

  bypass_rules:
    emergency_bypass: false
    admin_override: false
    auto_bypass_threshold: 0.95
    bypass_tracking: true

  ai_settings:
    style_learning_rate: 0.1
    pattern_adaptation: true
    team_preference_learning: true
    continuous_improvement: true

  style_patterns:
    indent_style: 'spaces'
    indent_size: 2
    max_line_length: 100
    naming_conventions:
      variables: 'camelCase'
      functions: 'camelCase'
      classes: 'PascalCase'
      constants: 'UPPER_SNAKE_CASE'
    import_order:
      - 'external'
      - 'internal'
      - 'relative'
    comment_style: 'descriptive'

  security_rules:
    - id: 'hardcoded_secrets'
      pattern: "(password|secret|key|token)\\s*=\\s*[\"'][^\"']+[\"']"
      severity: 'high'
      description: 'Hardcoded secrets detected'
    - id: 'sql_injection'
      pattern: "(SELECT|INSERT|UPDATE|DELETE).*\\+.*\\$"
      severity: 'high'
      description: 'Potential SQL injection vulnerability'
    - id: 'unsafe_eval'
      pattern: "eval\\s*\\("
      severity: 'medium'
      description: 'Unsafe eval() usage'
    - id: 'weak_crypto'
      pattern: 'md5|sha1'
      severity: 'medium'
      description: 'Weak cryptographic algorithm'

# ===============================================
# AUTONOMOUS DEPLOYMENT VALIDATION CONFIGURATION
# ===============================================

deployment_validation:
  validation_stages:
    smoke_tests:
      enabled: true
      timeout: 300
      retry_count: 3
      critical: true

    health_checks:
      enabled: true
      timeout: 60
      interval: 10
      critical: true

    performance_tests:
      enabled: true
      timeout: 600
      baseline_comparison: true
      critical: false

    integration_tests:
      enabled: true
      timeout: 900
      dependency_validation: true
      critical: true

    security_scans:
      enabled: true
      timeout: 300
      vulnerability_threshold: 'medium'
      critical: false

  rollback_triggers:
    health_check_failures: 3
    error_rate_threshold: 0.05
    response_time_degradation: 0.5
    critical_test_failures: 1

  monitoring:
    duration_minutes: 30
    alert_channels:
      - 'slack'
      - 'email'
    metrics_collection: true
    ai_anomaly_detection: true

  ai_settings:
    validation_learning: true
    auto_test_generation: true
    predictive_rollback: true
    performance_analysis: true

# ===============================================
# AUTONOMOUS ENVIRONMENT MANAGEMENT CONFIGURATION
# ===============================================

environment_management:
  environments:
    development:
      auto_provision: true
      auto_destroy: true
      drift_detection_interval: 300 # 5 minutes
      auto_healing: true
      resource_limits:
        cpu: '2000m'
        memory: '4Gi'
        storage: '20Gi'

    staging:
      auto_provision: true
      auto_destroy: false
      drift_detection_interval: 900 # 15 minutes
      auto_healing: true
      resource_limits:
        cpu: '4000m'
        memory: '8Gi'
        storage: '50Gi'

    production:
      auto_provision: false
      auto_destroy: false
      drift_detection_interval: 1800 # 30 minutes
      auto_healing: true
      resource_limits:
        cpu: '8000m'
        memory: '16Gi'
        storage: '100Gi'

  providers:
    docker:
      enabled: true
      host: 'unix://var/run/docker.sock'

    kubernetes:
      enabled: true
      config_path: '~/.kube/config'
      namespace: 'sovren'

    aws:
      enabled: false
      region: 'us-west-2'

  monitoring:
    metrics_collection: true
    alert_channels:
      - 'slack'
      - 'email'
    anomaly_detection: true
    performance_tracking: true

  optimization:
    resource_optimization: true
    cost_optimization: true
    performance_optimization: true
    ai_recommendations: true

  security:
    compliance_scanning: true
    vulnerability_assessment: true
    secret_rotation: true
    access_review: true

# ===============================================
# GLOBAL AI CONFIGURATION
# ===============================================

ai:
  openai:
    model: 'gpt-4'
    temperature: 0.1
    max_tokens: 1000

  machine_learning:
    models_path: 'models/'
    training_data_path: 'data/'
    model_update_frequency: 'weekly'

  feature_flags:
    ai_pipeline_optimization: true
    ai_code_analysis: true
    ai_deployment_decisions: true
    ai_environment_optimization: true

# ===============================================
# MONITORING AND ALERTING CONFIGURATION
# ===============================================

monitoring:
  metrics_retention: '90d'
  log_retention: '30d'

  prometheus:
    enabled: true
    scrape_interval: '15s'

  grafana:
    enabled: true
    dashboards_path: 'dashboards/'

  alerting:
    slack:
      webhook_url: '${SLACK_WEBHOOK_URL}'
      channel: '#devops-alerts'

    email:
      smtp_server: '${SMTP_SERVER}'
      from_address: 'alerts@sovren.dev'

    pagerduty:
      integration_key: '${PAGERDUTY_INTEGRATION_KEY}'

# ===============================================
# SECURITY CONFIGURATION
# ===============================================

security:
  secrets_management:
    provider: 'vault'
    auto_rotation: true
    rotation_interval: '30d'

  compliance:
    standards:
      - 'SOC2'
      - 'GDPR'
      - 'CCPA'
    scanning_interval: '24h'

  vulnerability_management:
    auto_patching: true
    severity_threshold: 'medium'
    maintenance_window: '02:00-04:00 UTC'

# ===============================================
# PERFORMANCE CONFIGURATION
# ===============================================

performance:
  build_optimization:
    cache_strategy: 'aggressive'
    parallel_builds: true
    build_isolation: true

  test_optimization:
    parallel_execution: true
    intelligent_selection: true
    test_impact_analysis: true

  deployment_optimization:
    progressive_rollout: true
    blue_green_deployment: true
    canary_analysis: true

# ===============================================
# DATA PERSISTENCE CONFIGURATION
# ===============================================

data:
  storage_path: 'data/'
  backup_enabled: true
  backup_retention: '90d'
  encryption_enabled: true

  files:
    pipeline_metrics: 'pipeline_metrics_history.csv'
    pre_commit_metrics: 'pre_commit_metrics.jsonl'
    deployment_validation: 'deployment_validation_history.json'
    environment_history: 'environment_history.json'
    learned_patterns: 'learned_style_patterns.json'
