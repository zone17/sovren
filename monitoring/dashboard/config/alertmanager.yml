# AlertManager Configuration
# Alert Routing and Notification for Sovren Payment System
# Story: PAY-013

global:
  # Global defaults
  resolve_timeout: 5m # Auto-resolve after 5 minutes of no alerts

  # Slack configuration (global defaults)
  slack_api_url: 'https://hooks.slack.com/services/YOUR_WEBHOOK_URL'

  # PagerDuty configuration
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree - determines how alerts are routed
route:
  # Default receiver for all alerts
  receiver: 'default-receiver'

  # Group alerts by these labels to reduce notification spam
  group_by: ['alertname', 'cluster', 'service', 'component']

  # Wait before sending notification (allows grouping)
  group_wait: 30s

  # Wait before sending notification about new alerts in existing group
  group_interval: 5m

  # Wait before resending notification for unresolved alerts
  repeat_interval: 4h

  # Routes for specific alert patterns
  routes:
    # CRITICAL PAYMENT ALERTS - Immediate notification
    - match:
        severity: critical
        team: payments
      receiver: 'payment-critical'
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 30m
      continue: true # Also send to default receiver

      routes:
        # After-hours critical alerts go to PagerDuty
        - match_re:
            alertname: '(HighPaymentFailureRate|LowPaymentSuccessRate|NoPaymentsProcessed|LightningNodeDown)'
          receiver: 'pagerduty-payments'
          group_wait: 0s # Immediate

    # WARNING PAYMENT ALERTS - Less urgent
    - match:
        severity: warning
        team: payments
      receiver: 'payment-warnings'
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 2h

    # INFRASTRUCTURE ALERTS - Go to ops team
    - match:
        team: infrastructure
      receiver: 'infrastructure-team'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

      routes:
        # Critical infrastructure issues go to PagerDuty
        - match:
            severity: critical
          receiver: 'pagerduty-infrastructure'
          continue: true

    # DATABASE ALERTS
    - match:
        component: database
      receiver: 'database-team'
      group_wait: 1m
      group_interval: 5m
      repeat_interval: 2h

    # MONITORING ALERTS (Prometheus itself)
    - match:
        component: monitoring
      receiver: 'monitoring-team'
      group_wait: 2m
      group_interval: 10m
      repeat_interval: 12h

# Inhibition rules - suppress certain alerts when others are active
inhibit_rules:
  # Suppress warning alerts if critical alert for same component is active
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['component', 'instance']

  # Suppress individual service alerts if entire cluster is down
  - source_match:
      alertname: PrometheusTargetDown
    target_match_re:
      alertname: '.*'
    equal: ['instance']

  # Suppress payment processing alerts if Lightning node is down
  - source_match:
      alertname: LightningNodeDown
    target_match_re:
      alertname: '(HighPaymentFailureRate|SlowPaymentProcessing)'
    equal: ['cluster']

  # Suppress slow query alerts if database is down
  - source_match:
      alertname: DatabaseConnectionFailed
    target_match:
      alertname: DatabaseSlowQueries
    equal: ['instance']

# Receivers - define how to send notifications
receivers:
  # Default receiver (console logging for development)
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://payment-api:3000/api/alerts/webhook'
        send_resolved: true

  # Payment team critical alerts
  - name: 'payment-critical'
    slack_configs:
      - channel: '#payments-critical'
        username: 'AlertManager'
        icon_emoji: ':rotating_light:'
        title: 'CRITICAL Payment Alert'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Component:* {{ .Labels.component }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
        send_resolved: true
    email_configs:
      - to: 'payments-oncall@sovren.com'
        from: 'alerts@sovren.com'
        smarthost: 'smtp.sendgrid.net:587'
        auth_username: 'apikey'
        auth_password: 'YOUR_SENDGRID_API_KEY'
        headers:
          Subject: '[CRITICAL] Payment System Alert: {{ .GroupLabels.alertname }}'
        send_resolved: true

  # Payment team warnings
  - name: 'payment-warnings'
    slack_configs:
      - channel: '#payments-warnings'
        username: 'AlertManager'
        icon_emoji: ':warning:'
        title: 'Payment Warning'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
        send_resolved: true

  # PagerDuty for payment emergencies
  - name: 'pagerduty-payments'
    pagerduty_configs:
      - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY_PAYMENTS'
        description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'
        details:
          severity: '{{ .CommonLabels.severity }}'
          component: '{{ .CommonLabels.component }}'
          description: '{{ .CommonAnnotations.description }}'
          runbook: '{{ .CommonAnnotations.runbook_url }}'
        send_resolved: true

  # Infrastructure team
  - name: 'infrastructure-team'
    slack_configs:
      - channel: '#infrastructure-alerts'
        username: 'AlertManager'
        icon_emoji: ':construction:'
        title: 'Infrastructure Alert'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Component:* {{ .Labels.component }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}
        send_resolved: true
    email_configs:
      - to: 'infrastructure@sovren.com'
        from: 'alerts@sovren.com'
        smarthost: 'smtp.sendgrid.net:587'
        auth_username: 'apikey'
        auth_password: 'YOUR_SENDGRID_API_KEY'
        headers:
          Subject: '[{{ .CommonLabels.severity | toUpper }}] Infrastructure Alert'
        send_resolved: true

  # PagerDuty for critical infrastructure
  - name: 'pagerduty-infrastructure'
    pagerduty_configs:
      - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY_INFRASTRUCTURE'
        description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'
        send_resolved: true

  # Database team
  - name: 'database-team'
    slack_configs:
      - channel: '#database-alerts'
        username: 'AlertManager'
        icon_emoji: ':database:'
        title: 'Database Alert'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Database:* {{ .Labels.database }}
          {{ end }}
        send_resolved: true
    email_configs:
      - to: 'database@sovren.com'
        from: 'alerts@sovren.com'
        smarthost: 'smtp.sendgrid.net:587'
        auth_username: 'apikey'
        auth_password: 'YOUR_SENDGRID_API_KEY'
        send_resolved: true

  # Monitoring team (for Prometheus itself)
  - name: 'monitoring-team'
    slack_configs:
      - channel: '#monitoring-alerts'
        username: 'AlertManager'
        icon_emoji: ':chart_with_upwards_trend:'
        title: 'Monitoring System Alert'
        send_resolved: true
    email_configs:
      - to: 'monitoring@sovren.com'
        from: 'alerts@sovren.com'
        smarthost: 'smtp.sendgrid.net:587'
        auth_username: 'apikey'
        auth_password: 'YOUR_SENDGRID_API_KEY'
        send_resolved: true
