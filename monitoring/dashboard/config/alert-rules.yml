# Prometheus Alert Rules
# Sovren Platform - Production Alerts
# Updated: US-E0-010 Observability Real-ification

groups:
  # SLO Alerts - Based on real prom-client metrics
  - name: slo_alerts
    interval: 30s
    rules:
      # SLO: API Availability - Error rate < 1% over 5m window
      - alert: SLOHighErrorRate
        expr: |
          (
            sum(rate(sovren_http_request_errors_total[5m]))
            /
            sum(rate(sovren_http_requests_total[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: critical
          team: backend
          slo: availability
        annotations:
          summary: "SLO violation: API error rate exceeds 1%"
          description: "API error rate is {{ $value | humanizePercentage }} (SLO: < 1%)."
          runbook_url: "docs/observability/runbooks/high-error-rate.md"

      # SLO: API Latency - P99 < 500ms
      - alert: SLOHighLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum(rate(sovren_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 5m
        labels:
          severity: critical
          team: backend
          slo: latency
        annotations:
          summary: "SLO violation: P99 latency exceeds 500ms"
          description: "P99 request latency is {{ $value }}s (SLO: < 500ms)."
          runbook_url: "docs/observability/runbooks/high-latency.md"

      # SLO: API Latency - P95 < 250ms (warning)
      - alert: SLOHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(sovren_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 0.25
        for: 5m
        labels:
          severity: warning
          team: backend
          slo: latency
        annotations:
          summary: "SLO warning: P95 latency exceeds 250ms"
          description: "P95 request latency is {{ $value }}s (target: < 250ms)."

      # SLO: Queue Job Completion Rate > 99%
      - alert: SLOQueueJobFailures
        expr: |
          (
            sum(rate(sovren_queue_jobs_total{status="failed"}[5m]))
            /
            sum(rate(sovren_queue_jobs_total[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: warning
          team: backend
          slo: queue-reliability
        annotations:
          summary: "SLO warning: Queue job failure rate exceeds 1%"
          description: "Queue job failure rate is {{ $value | humanizePercentage }}."

  # Payment System Alerts (kept from existing)
  - name: payment_system
    interval: 30s
    rules:
      - alert: HighPaymentFailureRate
        expr: |
          (
            rate(payment_total{status="failed"}[5m])
            /
            (rate(payment_total{status="failed"}[5m]) + rate(payment_total{status="completed"}[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          team: payments
        annotations:
          summary: "High payment failure rate detected"
          description: "Payment failure rate is {{ $value | humanizePercentage }} (threshold: 5%)."
          runbook_url: "docs/observability/runbooks/high-payment-failure-rate.md"

  # System Resource Alerts
  - name: system_resources
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: |
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "High CPU usage: {{ $value | humanize }}%"
          runbook_url: "docs/observability/runbooks/high-cpu-usage.md"

      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "High memory usage: {{ $value | humanize }}%"
          runbook_url: "docs/observability/runbooks/high-memory-usage.md"

      - alert: DiskSpaceLow
        expr: |
          (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Disk space low: {{ $value | humanize }}% used"
          runbook_url: "docs/observability/runbooks/disk-space-low.md"

  # Node.js Process Alerts (from prom-client default metrics)
  - name: nodejs_process
    interval: 30s
    rules:
      - alert: NodeJSHighHeapUsage
        expr: |
          sovren_nodejs_heap_size_used_bytes / sovren_nodejs_heap_size_total_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Node.js heap usage above 90%"
          description: "Heap is at {{ $value | humanizePercentage }}. Risk of OOM."

      - alert: NodeJSHighEventLoopLag
        expr: sovren_nodejs_eventloop_lag_seconds > 0.5
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Node.js event loop lag above 500ms"
          description: "Event loop lag is {{ $value }}s. App may be unresponsive."

  # Prometheus Meta-Alerts
  - name: prometheus
    interval: 60s
    rules:
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Target {{ $labels.job }} is down"
          description: "{{ $labels.job }} on {{ $labels.instance }} has been unreachable for 5+ minutes."
