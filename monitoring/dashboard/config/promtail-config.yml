# Promtail Configuration
# Log Shipping for Sovren Platform
# Updated: US-E0-010 Observability Real-ification

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Sovren API logs (structured JSON from Winston)
  - job_name: sovren-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: sovren-api
          service: backend
          component: api
          __path__: /data/sovren-api/*.log

    pipeline_stages:
      # Parse structured JSON logs from Winston
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            correlationId: correlationId
            service: service
            requestMethod: requestMethod
            requestPath: requestPath
            status: status
            durationMs: durationMs

      # Extract timestamp
      - timestamp:
          source: timestamp
          format: '2006-01-02T15:04:05.000Z07:00'

      # Promote fields to labels for efficient querying
      - labels:
          level:
          correlationId:
          service:

      # Drop debug logs in production
      - match:
          selector: '{level="debug"}'
          action: drop

  # Docker container logs (auto-discovery)
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/**/*.log

    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            message: message
            correlationId: correlationId
      - labels:
          level:

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/syslog

    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\S+\s+\S+\s+\S+) (?P<hostname>\S+) (?P<service>\S+): (?P<message>.*)$'
      - labels:
          hostname:
          service:

  # Database logs (PostgreSQL)
  - job_name: postgres
    static_configs:
      - targets:
          - localhost
        labels:
          job: postgres
          service: database
          __path__: /var/log/postgresql/*.log

    pipeline_stages:
      - regex:
          expression: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3} \w+ \[(?P<pid>\d+)\] (?P<level>\w+):  (?P<message>.*)$'
      - labels:
          level:
          pid:

  # Lightning Network node logs
  - job_name: lightning-node
    static_configs:
      - targets:
          - localhost
        labels:
          job: lightning-node
          service: lightning
          __path__: /data/lightning/*.log

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            invoice: invoice
            payment_hash: payment_hash

      - timestamp:
          source: timestamp
          format: RFC3339

      - labels:
          level:
