# Docker Compose - Monitoring Stack
# Production-grade observability infrastructure for Sovren Payment System
# Story: PAY-013
#
# Services:
# - Prometheus: Metrics collection and storage
# - Grafana: Visualization and dashboards
# - AlertManager: Alert routing and notification
# - Node Exporter: System metrics
# - Loki: Log aggregation
# - Promtail: Log shipping

version: '3.8'

networks:
  monitoring:
    driver: bridge
  payment-network:
    external: true # Connect to existing payment system network

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  alertmanager-data:
    driver: local

services:
  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: sovren-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - '9090:9090'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring
      - payment-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:9090/-/healthy']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - 'com.sovren.monitoring=prometheus'
      - 'com.sovren.service=metrics'

  # AlertManager - Alert Routing
  alertmanager:
    image: prom/alertmanager:latest
    container_name: sovren-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
      - '--cluster.advertise-address=0.0.0.0:9093'
    ports:
      - '9093:9093'
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - monitoring
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:9093/-/healthy']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - 'com.sovren.monitoring=alertmanager'
      - 'com.sovren.service=alerting'

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: sovren-grafana
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-clock-panel
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - 'com.sovren.monitoring=grafana'
      - 'com.sovren.service=visualization'

  # Node Exporter - System Metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: sovren-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - '9100:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
    labels:
      - 'com.sovren.monitoring=node-exporter'
      - 'com.sovren.service=system-metrics'

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: sovren-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - '3100:3100'
    volumes:
      - ./config/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - monitoring
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3100/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - 'com.sovren.monitoring=loki'
      - 'com.sovren.service=log-aggregation'

  # Promtail - Log Shipping
  promtail:
    image: grafana/promtail:latest
    container_name: sovren-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./config/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
      - ./data:/data:ro # Application logs
    networks:
      - monitoring
    depends_on:
      - loki
    labels:
      - 'com.sovren.monitoring=promtail'
      - 'com.sovren.service=log-shipping'

  # PostgreSQL Exporter (for database metrics)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: sovren-postgres-exporter
    restart: unless-stopped
    ports:
      - '9187:9187'
    environment:
      - DATA_SOURCE_NAME=postgresql://user:password@postgres:5432/payments?sslmode=disable
    networks:
      - monitoring
      - payment-network
    labels:
      - 'com.sovren.monitoring=postgres-exporter'
      - 'com.sovren.service=database-metrics'

  # Redis Exporter (if using Redis for caching)
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: sovren-redis-exporter
    restart: unless-stopped
    ports:
      - '9121:9121'
    environment:
      - REDIS_ADDR=redis:6379
    networks:
      - monitoring
      - payment-network
    labels:
      - 'com.sovren.monitoring=redis-exporter'
      - 'com.sovren.service=cache-metrics'
