# Grafana Alerting Notification Policies
# Routes alerts to appropriate contact points based on severity

apiVersion: 1

policies:
  - orgId: 1
    receiver: slack-payments-warning  # Default receiver
    group_by: ['alertname', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Critical alerts: Page on-call + Slack + Email
      - receiver: pagerduty-critical
        matchers:
          - severity = critical
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 1h
        continue: true  # Also send to other receivers
        routes:
          - receiver: slack-payments-critical
            continue: true
          - receiver: email-oncall

      # Warning alerts: Slack only
      - receiver: slack-payments-warning
        matchers:
          - severity = warning
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h

      # Info alerts: Slack only, less frequent
      - receiver: slack-payments-warning
        matchers:
          - severity = info
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 12h
