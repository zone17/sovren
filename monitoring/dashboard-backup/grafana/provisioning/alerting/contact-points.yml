# Grafana Alerting Contact Points Configuration
# Defines notification channels for alerts

apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack-payments-critical
    receivers:
      - uid: slack-payments-critical
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL_CRITICAL}
          recipient: '#payments-critical'
          title: '🚨 Critical Payment Alert'
          text: |
            **Alert**: {{ .CommonLabels.alertname }}
            **Severity**: {{ .CommonLabels.severity }}
            **Summary**: {{ .CommonAnnotations.summary }}
            **Description**: {{ .CommonAnnotations.description }}
            **Runbook**: {{ .CommonAnnotations.runbook_url }}
            **Dashboard**: {{ .CommonAnnotations.dashboard_url }}
          username: Sovren Monitoring
        disableResolveMessage: false

  - orgId: 1
    name: slack-payments-warning
    receivers:
      - uid: slack-payments-warning
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL_WARNING}
          recipient: '#payments-alerts'
          title: '⚠️ Payment Warning'
          text: |
            **Alert**: {{ .CommonLabels.alertname }}
            **Severity**: {{ .CommonLabels.severity }}
            **Summary**: {{ .CommonAnnotations.summary }}
            **Description**: {{ .CommonAnnotations.description }}
            **Runbook**: {{ .CommonAnnotations.runbook_url }}
          username: Sovren Monitoring
        disableResolveMessage: false

  - orgId: 1
    name: email-oncall
    receivers:
      - uid: email-oncall
        type: email
        settings:
          addresses: ${ONCALL_EMAIL_ADDRESSES}
          singleEmail: false
        disableResolveMessage: false

  - orgId: 1
    name: pagerduty-critical
    receivers:
      - uid: pagerduty-critical
        type: pagerduty
        settings:
          integrationKey: ${PAGERDUTY_INTEGRATION_KEY}
          severity: critical
          class: payment-system
          component: lightning-network
        disableResolveMessage: false
