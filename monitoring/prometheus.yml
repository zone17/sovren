global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ce-pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['ce-pushgateway:9091']
    scrape_interval: 15s

  - job_name: 'ce-prometheus'
    static_configs:
      - targets: ['localhost:9090']
