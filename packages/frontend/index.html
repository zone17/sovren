<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <script>
      // Dark-first: only switch to light if explicitly stored.
      // Validation: exact match on 'light' means any other value (null, garbage,
      // stale 'system') is safely ignored and the dark default applies.
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.replace('dark', 'light');
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
    <!-- Google Fonts: SRI integrity attributes are not possible here because the
         fonts.googleapis.com CSS endpoint returns different content per user-agent
         (browser-specific font formats). The hash would differ on every request.
         Self-hosting fonts is the alternative but adds maintenance burden for
         minimal security gain (fonts are non-executable resources). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sovren</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
