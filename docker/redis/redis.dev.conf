# Redis Development Configuration
# Optimized for development with enhanced logging and debugging

# Network Configuration
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General Configuration
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile /var/log/redis/redis-server.log
databases 16

# Memory Management (development-friendly)
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence Settings (relaxed for development)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Append Only File (AOF) - disabled for development
appendonly no
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Lua Scripting
lua-time-limit 5000

# Slow Log (enhanced for development)
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency Monitoring
latency-monitor-threshold 100

# Event Notification
notify-keyspace-events "Ex"

# Client Management
timeout 0
tcp-keepalive 300
maxclients 10000

# Memory Usage Optimization
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active Rehashing
activerehashing yes

# Client Output Buffer Limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Client Query Buffer Limit
client-query-buffer-limit 1gb

# Protocol Buffer Limit
proto-max-bulk-len 512mb

# Frequency of Background Tasks
hz 10

# Dynamic HZ
dynamic-hz yes

# AOF Rewrite Incremental Fsync
aof-rewrite-incremental-fsync yes

# RDB Save Incremental Fsync
rdb-save-incremental-fsync yes

# LFU Configuration
lfu-log-factor 10
lfu-decay-time 1

# Threaded I/O
io-threads 4
io-threads-do-reads yes

# TLS/SSL (disabled for development)
tls-port 0
tls-cert-file ""
tls-key-file ""
tls-ca-cert-file ""
tls-dh-params-file ""

# Access Control Lists (ACL) - simplified for development
user default on nopass ~* &* +@all

# Modules
# loadmodule /path/to/module.so

# Security (relaxed for development)
protected-mode no
requirepass dev_redis_password

# Keyspace Notifications
notify-keyspace-events "Ex"

# Latency Monitoring
latency-monitor-threshold 100

# Memory Usage Reporting
memory-usage-sample-keys 5

# Tracking
tracking-table-max-keys 1000000

# Jemalloc Configuration
jemalloc-bg-thread yes

# Memory Defragmentation
activedefrag no
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-max 25
active-defrag-max-scan-fields 1000

# Development-Specific Settings
# Enable debug mode for development
debug-mode no

# Extended Stats
extended-redis-monitoring yes

# Logging Configuration
syslog-enabled no
syslog-ident redis
syslog-facility local0

# Replica Configuration (for future scaling)
replicaof-serve-stale-data yes
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-ping-replica-period 10
repl-timeout 60
repl-disable-tcp-nodelay no
repl-backlog-size 1mb
repl-backlog-ttl 3600
replica-priority 100
min-replicas-to-write 0
min-replicas-max-lag 10

# Sentinel Configuration
sentinel-announce-ip ""
sentinel-announce-port 0
