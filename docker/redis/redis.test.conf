# Redis Test Configuration
# Optimized for testing environment with faster settings

# Network Configuration
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General Configuration
daemonize no
supervised no
pidfile /var/run/redis_test_6379.pid
loglevel notice
logfile /var/log/redis/redis-test.log
databases 16

# Memory Management (test-optimized)
maxmemory 128mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence Settings (disabled for tests)
save ""
stop-writes-on-bgsave-error no
rdbcompression yes
rdbchecksum yes
dbfilename dump-test.rdb
dir /data

# Append Only File (AOF) - disabled for tests
appendonly no
appendfilename "appendonly-test.aof"
appendfsync no
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Lua Scripting
lua-time-limit 5000

# Slow Log (reduced for tests)
slowlog-log-slower-than 1000
slowlog-max-len 64

# Latency Monitoring
latency-monitor-threshold 10

# Event Notification (disabled for tests)
notify-keyspace-events ""

# Client Management
timeout 0
tcp-keepalive 300
maxclients 1000

# Memory Usage Optimization
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active Rehashing
activerehashing yes

# Client Output Buffer Limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Client Query Buffer Limit
client-query-buffer-limit 1gb

# Protocol Buffer Limit
proto-max-bulk-len 512mb

# Frequency of Background Tasks
hz 10

# Dynamic HZ
dynamic-hz yes

# AOF Rewrite Incremental Fsync
aof-rewrite-incremental-fsync yes

# RDB Save Incremental Fsync
rdb-save-incremental-fsync yes

# LFU Configuration
lfu-log-factor 10
lfu-decay-time 1

# Threaded I/O
io-threads 2
io-threads-do-reads yes

# TLS/SSL (disabled for tests)
tls-port 0
tls-cert-file ""
tls-key-file ""
tls-ca-cert-file ""
tls-dh-params-file ""

# Access Control Lists (ACL) - simplified for tests
user default on nopass ~* &* +@all

# Security (disabled for tests)
protected-mode no
requirepass ""

# Keyspace Notifications (disabled for tests)
notify-keyspace-events ""

# Latency Monitoring (reduced for tests)
latency-monitor-threshold 10

# Memory Usage Reporting
memory-usage-sample-keys 5

# Tracking
tracking-table-max-keys 100000

# Jemalloc Configuration
jemalloc-bg-thread no

# Memory Defragmentation (disabled for tests)
activedefrag no

# Test-Specific Settings
debug-mode no
extended-redis-monitoring no

# Logging Configuration
syslog-enabled no
syslog-ident redis-test
syslog-facility local0

# Replica Configuration (disabled for tests)
replicaof-serve-stale-data yes
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-ping-replica-period 10
repl-timeout 60
repl-disable-tcp-nodelay no
repl-backlog-size 1mb
repl-backlog-ttl 3600
replica-priority 100
min-replicas-to-write 0
min-replicas-max-lag 10

# Test optimizations
tcp-keepalive 0
timeout 0
lua-time-limit 5000
