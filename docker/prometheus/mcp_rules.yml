groups:
  - name: mcp_alerts
    rules:
      # Service availability alerts
      - alert: MCPServiceDown
        expr: up{job=~"mcp-.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'MCP service {{ $labels.job }} is down'
          description: 'MCP service {{ $labels.job }} has been down for more than 2 minutes'

      # High error rate alerts
      - alert: MCPHighErrorRate
        expr: rate(mcp_requests_failed_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High error rate in MCP gateway'
          description: 'MCP gateway error rate is {{ $value }} errors per second'

      # Authentication failure alerts
      - alert: MCPUnauthorizedAttempts
        expr: rate(mcp_unauthorized_attempts_total[5m]) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'High number of unauthorized attempts'
          description: '{{ $value }} unauthorized attempts per second detected'

      # Resource usage alerts
      - alert: MCPHighMemoryUsage
        expr: container_memory_usage_bytes{name=~".*mcp.*"} / container_spec_memory_limit_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High memory usage in {{ $labels.name }}'
          description: 'Container {{ $labels.name }} is using {{ $value | humanizePercentage }} of memory'

      - alert: MCPHighCPUUsage
        expr: rate(container_cpu_usage_seconds_total{name=~".*mcp.*"}[5m]) / container_spec_cpu_quota * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High CPU usage in {{ $labels.name }}'
          description: 'Container {{ $labels.name }} is using {{ $value }}% CPU'

      # Rate limiting alerts
      - alert: MCPRateLimitHit
        expr: increase(mcp_rate_limit_hits_total[5m]) > 10
        for: 1m
        labels:
          severity: info
        annotations:
          summary: 'Rate limiting active'
          description: '{{ $value }} rate limit hits in the last 5 minutes'
