# Redis Production Configuration
# Based on redis.conf (dev) — hardened for production

# Network — bind to all interfaces; restrict access via Docker network
bind 0.0.0.0
port 6379
protected-mode yes

# General
daemonize no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""

# Require a strong password (set via REDIS_PASSWORD env var or Docker secret)
# The requirepass directive must be set here; use a 64+ char random string in prod.
# Override this value by mounting a secrets-based redis.conf over this file.
requirepass CHANGE_ME_USE_STRONG_RANDOM_PASSWORD

# Disable dangerous commands in production
rename-command FLUSHALL ""
rename-command FLUSHDB  ""
rename-command CONFIG   ""
rename-command DEBUG    ""
rename-command KEYS     ""
rename-command SLAVEOF  ""
rename-command REPLICAOF ""

# Memory — hard cap at 400MB (container limit is 512M; leave headroom for OS)
maxmemory 400mb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# Persistence — AOF (append-only file) for durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# RDB snapshots as secondary backup
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Latency & performance
tcp-keepalive 300
timeout 300
tcp-backlog 511
databases 16

# Slow log — log queries taking >10ms
slowlog-log-slower-than 10000
slowlog-max-len 128

# Disable transparent hugepages warning (informational, handled at OS level)
# To suppress the warning: echo never > /sys/kernel/mm/transparent_hugepage/enabled

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Active defragmentation (Redis 4+)
activedefrag no

# Lazyfree — async deletion for large keys
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
